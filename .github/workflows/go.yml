name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...

  release:
    name: Publish v0.2.0
    needs: test
    # Publish this version only for its explicit release commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release typy v0.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Breaking change: rename ptr.NewPtr(value) to ptr.New(value).

            - Remove the NewPtr name; update callers to ptr.New.
            - Preserve pointer copy semantics and nil-value behavior.
            - Update tests, examples, and per-tool documentation.
            - errlay and opt APIs are unchanged.

            Requires Go 1.25 or newer.

            Install: go get github.com/cohesian-tools/typy@v0.2.0
        run: |
          # A retry must preserve an already published tag and release.
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing v0.2.0 release"
          else
            gh release create v0.2.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "typy v0.2.0" \
              --notes "$RELEASE_NOTES"
          fi
      - name: Index and verify published module
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          # New tags may take a short time to propagate to the module proxy.
          for attempt in 1 2 3 4 5; do
            if go list -m github.com/cohesian-tools/typy@v0.2.0; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          go mod init typy-release-check
          go get github.com/cohesian-tools/typy/ptr@v0.2.0 \
            github.com/cohesian-tools/typy/errlay@v0.2.0 \
            github.com/cohesian-tools/typy/opt@v0.2.0 \
            github.com/cohesian-tools/typy/opt/nullable@v0.2.0
          go build github.com/cohesian-tools/typy/ptr \
            github.com/cohesian-tools/typy/errlay \
            github.com/cohesian-tools/typy/opt \
            github.com/cohesian-tools/typy/opt/nullable
