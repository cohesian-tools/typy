name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...

  first-release:
    name: Publish v0.1.0
    needs: test
    # Bootstrap only: later commits run checks without publishing a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release typy v0.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            First release of the typy Go toolbox.

            - ptr: generic pointer construction.
            - errlay: layered errors with standard error-chain matching.
            - opt: optional values with JSON/BSON codecs, plus opt/nullable.
            - Per-tool documentation and executable examples.

            Requires Go 1.25 or newer.

            Install: go get github.com/cohesian-tools/typy@v0.1.0
        run: |
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "typy v0.1.0" \
            --notes "$RELEASE_NOTES"
      - name: Index and verify published module
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          go list -m github.com/cohesian-tools/typy@v0.1.0
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          go mod init typy-release-check
          go get github.com/cohesian-tools/typy/ptr@v0.1.0 \
            github.com/cohesian-tools/typy/errlay@v0.1.0 \
            github.com/cohesian-tools/typy/opt@v0.1.0 \
            github.com/cohesian-tools/typy/opt/nullable@v0.1.0
          go build github.com/cohesian-tools/typy/ptr \
            github.com/cohesian-tools/typy/errlay \
            github.com/cohesian-tools/typy/opt \
            github.com/cohesian-tools/typy/opt/nullable
